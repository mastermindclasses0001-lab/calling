<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Receptionist</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
        .box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 5px; }
        button.stop { background: #dc3545; display: none; }
        #log { margin-top: 20px; text-align: left; height: 300px; overflow-y: auto; background: #fff; padding: 10px; border: 1px solid #ddd; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Coaching AI Voice Agent</h2>
        <button id="startBtn" onclick="startAgent()">Call Start Karein</button>
        <button id="stopBtn" class="stop" onclick="stopAgent()">Call Cut Karein</button>
        <div id="log"></div>
    </div>

    <!-- Pre-cached Filler Audio (Zero Delay Trick) -->
    <audio id="fillerAudio" src="https://assets.mixkit.co/active_storage/sfx/2996/2996-preview.mp3"></audio>

    <script>
        const GROQ_API_KEY = "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";
        const RENDER_TTS_URL = "https://caling-yn6v.onrender.com/tts";

        let recognition;
        let isRunning = false;

        function logMessage(sender, text) {
            document.getElementById("log").innerHTML += `<p><b>${sender}:</b> ${text}</p>`;
            document.getElementById("log").scrollTop = document.getElementById("log").scrollHeight;
        }

        function startAgent() {
            document.getElementById("startBtn").style.display = "none";
            document.getElementById("stopBtn").style.display = "inline-block";
            isRunning = true;
            
            recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.continuous = false;
            recognition.lang = 'hi-IN';

            recognition.onresult = async function(event) {
                const text = event.results[0][0].transcript;
                logMessage("Guardian", text);

                // Filler sound play karna taaki delay feel na ho
                document.getElementById("fillerAudio").play();

                let aiReply = await getGroqResponse(text);
                logMessage("AI", aiReply);

                playHighQualityVoice(aiReply);
            };

            recognition.onend = function() {
                if (isRunning) recognition.start();
            };

            recognition.start();
            logMessage("System", "Mic ON hai. Boliye...");
        }

        function stopAgent() {
            isRunning = false;
            if (recognition) recognition.stop();
            document.getElementById("startBtn").style.display = "inline-block";
            document.getElementById("stopBtn").style.display = "none";
            logMessage("System", "Agent band kar diya gaya hai.");
        }

        async function getGroqResponse(promptText) {
            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama3-8b-8192",
                        messages: [
                            {"role": "system", "content": "Tum ek coaching institute ki female receptionist ho. Jawab sirf 3 se 5 words me dena. Hindi/Hinglish me."},
                            {"role": "user", "content": promptText}
                        ]
                    })
                });
                const data = await response.json();
                return data.choices[0].message.content;
            } catch (error) {
                return "Network issue hai.";
            }
        }

        function playHighQualityVoice(text) {
            const audioUrl = `${RENDER_TTS_URL}?text=${encodeURIComponent(text)}`;
            const audio = new Audio(audioUrl);
            audio.play();
        }
    </script>
</body>
</html>
